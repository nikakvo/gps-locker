plugins {
    id 'com.android.application'
}

android {
    namespace = 'io.github.nikakvo.gpslocker'
    compileSdk = 37

    defaultConfig {
        applicationId = 'io.github.nikakvo.gpslocker'
        minSdk = 31
        targetSdk = 36
        versionCode = 1
        versionName = '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds = false
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}
