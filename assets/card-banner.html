<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Module card banner (module/banner.png). The manager draws it faded behind the card text,
     so the left side stays calm and the right side carries one bold, high-contrast emblem. -->
<style>
html,body { margin:0; padding:0; background:#000; }
svg { display:block; }
</style></head>
<body>
<svg id="b" width="1280" height="480" viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03141a"/>
      <stop offset=".55" stop-color="#062630"/>
      <stop offset="1" stop-color="#0a3a47"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#00e5ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="sat">
      <rect x="-30" y="-9" width="20" height="18" rx="2" fill="currentColor" opacity=".75"/>
      <rect x="10" y="-9" width="20" height="18" rx="2" fill="currentColor" opacity=".75"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="currentColor" stroke-width="3"/>
      <rect x="-8" y="-8" width="16" height="16" rx="3" fill="currentColor"/>
    </g>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>

  <!-- faint lat/long grid, fading to the left -->
  <g fill="none" stroke="#00e5ff" stroke-width="1.2" opacity=".14">
    <circle cx="960" cy="240" r="215"/>
    <circle cx="960" cy="240" r="290"/>
    <circle cx="960" cy="240" r="370"/>
    <circle cx="960" cy="240" r="455"/>
  </g>

  <!-- beams from satellites to the lock point -->
  <g stroke-width="3" stroke-linecap="round" opacity=".55">
    <line x1="700" y1="70"  x2="960" y2="240" stroke="#4d8dff"/>
    <line x1="1215" y1="60" x2="960" y2="240" stroke="#ffaa00"/>
    <line x1="1235" y1="410" x2="960" y2="240" stroke="#cc88ff"/>
    <line x1="690" y1="405" x2="960" y2="240" stroke="#ff5566"/>
  </g>

  <!-- emblem: crosshair lock -->
  <circle cx="960" cy="240" r="170" fill="url(#halo)"/>
  <g transform="translate(960 240)" filter="url(#glow)" fill="none" stroke="#00e5ff" stroke-linecap="round">
    <circle r="112" stroke-width="12"/>
    <circle r="62" stroke-width="7" stroke-opacity=".75" stroke-dasharray="14 12"/>
    <path d="M0,-160 V-124 M0,124 V160 M-160,0 H-124 M124,0 H160" stroke-width="13"/>
    <circle r="30" fill="#00e5ff" stroke="none"/>
  </g>

  <!-- satellites -->
  <g filter="url(#glow)">
    <use href="#sat" transform="translate(700 70) rotate(-25) scale(1.5)"  color="#4d8dff"/>
    <use href="#sat" transform="translate(1215 60) rotate(20) scale(1.5)" color="#ffaa00"/>
    <use href="#sat" transform="translate(1235 410) rotate(-15) scale(1.5)" color="#cc88ff"/>
    <use href="#sat" transform="translate(690 405) rotate(18) scale(1.5)"  color="#ff5566"/>
  </g>
</svg>
</body></html>
