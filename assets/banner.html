<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'STM'; src: url('node_modules/@fontsource/share-tech-mono/files/share-tech-mono-latin-400-normal.woff2') format('woff2'); }
html,body { margin:0; padding:0; background:#000; }
svg { display:block; }
</style></head>
<body>
<svg id="b" width="1280" height="480" viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky" cx="72%" cy="40%" r="85%">
      <stop offset="0" stop-color="#06202a"/>
      <stop offset="0.45" stop-color="#020b10"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="earth" cx="50%" cy="20%" r="70%">
      <stop offset="0" stop-color="#0b3d4c"/>
      <stop offset="0.55" stop-color="#05202a"/>
      <stop offset="1" stop-color="#010a0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity=".75"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="earthClip"><circle cx="880" cy="1190" r="830"/></clipPath>
    <g id="sat">
      <rect x="-13" y="-4" width="9" height="8" rx="1" fill="currentColor" opacity=".55"/>
      <rect x="4" y="-4" width="9" height="8" rx="1" fill="currentColor" opacity=".55"/>
      <line x1="-4" y1="0" x2="4" y2="0" stroke="currentColor" stroke-width="1.4"/>
      <rect x="-3.2" y="-3.2" width="6.4" height="6.4" rx="1.2" fill="currentColor"/>
    </g>
  </defs>

  <rect width="1280" height="480" fill="url(#sky)"/>
  <g id="stars"></g>

  <!-- earth -->
  <circle cx="880" cy="1190" r="846" fill="#00e5ff" opacity=".18" filter="url(#soft)"/>
  <circle cx="880" cy="1190" r="830" fill="url(#earth)"/>
  <g clip-path="url(#earthClip)" fill="none" stroke="#00e5ff" stroke-opacity=".13" stroke-width="1">
    <ellipse cx="880" cy="1190" rx="830" ry="120" transform="translate(0,-760)"/>
    <ellipse cx="880" cy="1190" rx="760" ry="150" transform="translate(0,-700)"/>
    <ellipse cx="880" cy="1190" rx="640" ry="170" transform="translate(0,-630)"/>
    <ellipse cx="880" cy="1190" rx="230" ry="830"/>
    <ellipse cx="880" cy="1190" rx="470" ry="830"/>
    <ellipse cx="880" cy="1190" rx="680" ry="830"/>
  </g>
  <circle cx="880" cy="1190" r="830" fill="none" stroke="#00e5ff" stroke-opacity=".55" stroke-width="1.5"/>

  <!-- orbits -->
  <g fill="none" stroke-width="1.2">
    <ellipse cx="880" cy="330" rx="420" ry="88" transform="rotate(-9 880 330)" stroke="#4d8dff" stroke-opacity=".35" stroke-dasharray="3 6"/>
    <ellipse cx="880" cy="300" rx="350" ry="150" transform="rotate(14 880 300)" stroke="#cc88ff" stroke-opacity=".28" stroke-dasharray="2 7"/>
    <ellipse cx="900" cy="250" rx="300" ry="190" transform="rotate(-28 900 250)" stroke="#ffaa00" stroke-opacity=".22" stroke-dasharray="2 8"/>
  </g>

  <!-- beams to the locked point -->
  <g id="beams"></g>

  <!-- locked point on earth -->
  <g transform="translate(880 372)">
    <circle r="60" fill="url(#glow)"/>
    <circle r="22" fill="none" stroke="#00e5ff" stroke-width="2.4"/>
    <circle r="8" fill="#00e5ff"/>
    <path d="M0,-38 V-27 M0,27 V38 M-38,0 H-27 M27,0 H38" stroke="#00e5ff" stroke-width="2.6" stroke-linecap="round"/>
    <circle r="32" fill="none" stroke="#00e5ff" stroke-opacity=".35" stroke-width="1" stroke-dasharray="4 5"/>
  </g>

  <!-- satellites -->
  <g id="sats"></g>

  <!-- title -->
  <g font-family="STM, 'DejaVu Sans Mono', monospace">
    <text x="64" y="196" font-size="78" fill="#e8fdff" letter-spacing="6">GPS</text>
    <text x="64" y="276" font-size="78" fill="#00e5ff" letter-spacing="6">LOCKER</text>
    <rect x="66" y="300" width="56" height="3" fill="#00e5ff"/>
    <text x="66" y="340" font-size="19" fill="#4f9aae" letter-spacing="3">SATELLITES STAY LOCKED</text>
    <g font-size="15" letter-spacing="2" fill="#4f7280">
      <text x="66" y="392"><tspan fill="#4d8dff">●</tspan> GPS  <tspan fill="#ff5566">●</tspan> GLO  <tspan fill="#ffaa00">●</tspan> BDS  <tspan fill="#cc88ff">●</tspan> GAL</text>
      <text x="66" y="420">L1 + L5 · GNSS KEEP-ALIVE</text>
    </g>
  </g>
</svg>
<script>
  // deterministic pseudo random
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  var ns = 'http://www.w3.org/2000/svg';
  var stars = document.getElementById('stars');
  for (var i = 0; i < 140; i++) {
    var x = rnd() * 1280, y = rnd() * 420;
    var c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('r', (rnd() * 1.1 + .3).toFixed(2));
    c.setAttribute('fill', '#bfefff'); c.setAttribute('opacity', (rnd() * .5 + .12).toFixed(2));
    stars.appendChild(c);
  }
  // satellites: [x, y, color, locked]
  var S = [
    [545, 238, '#4d8dff', 1], [690, 120, '#cc88ff', 1], [820, 70, '#ffaa00', 1],
    [1000, 92, '#4d8dff', 1], [1135, 190, '#cc88ff', 1], [1222, 300, '#ffaa00', 1],
    [610, 330, '#ff5566', 1], [1160, 360, '#4d8dff', 0], [930, 190, '#ffaa00', 1],
    [760, 230, '#cc88ff', 0], [1250, 120, '#ff5566', 0]
  ];
  var beams = document.getElementById('beams'), sats = document.getElementById('sats');
  S.forEach(function (s, i) {
    if (s[3]) {
      var l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', s[0]); l.setAttribute('y1', s[1]);
      l.setAttribute('x2', 880); l.setAttribute('y2', 372);
      l.setAttribute('stroke', s[2]); l.setAttribute('stroke-opacity', '.33'); l.setAttribute('stroke-width', '1.2');
      beams.appendChild(l);
    }
    var g = document.createElementNS(ns, 'g');
    var rot = (rnd() * 70 - 35).toFixed(0);
    g.setAttribute('transform', 'translate(' + s[0] + ' ' + s[1] + ') rotate(' + rot + ') scale(' + (s[3] ? 1.35 : 1.05) + ')');
    g.setAttribute('color', s[2]);
    if (s[3]) {
      var h = document.createElementNS(ns, 'circle');
      h.setAttribute('r', '15'); h.setAttribute('fill', s[2]); h.setAttribute('opacity', '.22'); h.setAttribute('filter', 'url(#soft2)');
      g.appendChild(h);
    } else g.setAttribute('opacity', '.45');
    var u = document.createElementNS(ns, 'use');
    u.setAttribute('href', '#sat');
    g.appendChild(u);
    sats.appendChild(g);
  });
</script>
</body></html>
